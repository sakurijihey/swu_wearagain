<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>입고 또 입기 — 나의 의류 소비 유형</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-dark: #3a5a2a;
  --green-mid: #5a8a3a;
  --green-light: #a8c878;
  --bg: #f2f0e8;
  --white: #fff;
  --text: #1a1a1a;
  --text-soft: #666;
  --radius: 16px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ───── PAGE SYSTEM ───── */
.page { display: none; min-height: 100vh; }
.page.active { display: block; }

/* ───── QUIZ PAGE ───── */
.quiz-wrap {
  padding: 2rem 1.25rem;
  max-width: 420px;
  margin: 0 auto;
}

.brand-tag {
  font-size: 12px;
  color: var(--green-dark);
  font-weight: 600;
  letter-spacing: 0.05em;
  margin-bottom: 1.5rem;
  opacity: 0.7;
}

.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.75rem;
}
.progress-bar-bg { flex: 1; height: 4px; background: #ddd; border-radius: 2px; }
.progress-bar-fill { height: 4px; background: var(--green-dark); border-radius: 2px; transition: width 0.35s ease; }
.progress-label { font-size: 12px; color: #aaa; min-width: 32px; text-align: right; }

.q-text {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.55;
  margin-bottom: 1.5rem;
  color: var(--text);
}

.option-btn {
  display: block; width: 100%;
  text-align: left; padding: 14px 16px;
  background: var(--white);
  border: 1.5px solid transparent;
  border-radius: 12px;
  font-size: 15px; color: var(--text);
  cursor: pointer; margin-bottom: 10px;
  transition: all 0.15s;
  line-height: 1.5;
  font-family: inherit;
}
.option-btn:hover { background: #f0ede6; }
.option-btn.selected { border-color: var(--green-dark); background: #eef4e8; }

.next-btn {
  display: block; width: 100%; padding: 15px;
  background: var(--green-dark); color: var(--white);
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  margin-top: 1.25rem; opacity: 0.25; pointer-events: none;
  transition: opacity 0.2s; font-family: inherit;
}
.next-btn.active { opacity: 1; pointer-events: all; }
.next-btn:active { transform: scale(0.98); }

/* ───── RESULT PAGE ───── */
.result-wrap {
  padding: 2rem 1.25rem 3rem;
  max-width: 420px;
  margin: 0 auto;
}

.result-badge { font-size: 52px; text-align: center; margin-bottom: 0.75rem; }
.result-type { font-size: 26px; font-weight: 700; text-align: center; color: var(--text); margin-bottom: 0.4rem; }
.result-sub { font-size: 14px; color: var(--text-soft); text-align: center; margin-bottom: 1.5rem; line-height: 1.5; }
.result-desc {
  font-size: 15px; color: #333; line-height: 1.75;
  background: var(--white); border-radius: var(--radius);
  padding: 1rem 1.25rem; margin-bottom: 1.5rem;
}
.tip-title { font-size: 12px; font-weight: 600; color: #aaa; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
.tip-item {
  font-size: 14px; color: #333; line-height: 1.65;
  padding: 12px 14px;
  border-left: 3px solid var(--green-light);
  margin-bottom: 10px;
  background: #f7f9f4;
  border-radius: 0 10px 10px 0;
}

.guide-btn {
  display: block; width: 100%; padding: 16px;
  background: var(--green-dark); color: var(--white);
  border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  margin-top: 1.5rem; font-family: inherit;
  transition: background 0.15s;
}
.guide-btn:hover { background: var(--green-mid); }
.guide-btn:active { transform: scale(0.98); }

.retry-btn {
  display: block; width: 100%; padding: 14px;
  background: transparent; color: var(--text-soft);
  border: 1.5px solid #ddd; border-radius: 12px;
  font-size: 14px; cursor: pointer; margin-top: 0.75rem;
  font-family: inherit;
}

/* ───── PAMPHLET PAGE ───── */
.pamphlet-wrap {
  padding: 1.5rem 1.25rem 3rem;
  max-width: 420px;
  margin: 0 auto;
}

.pamphlet-header {
  text-align: center;
  margin-bottom: 1.75rem;
}
.pamphlet-header h1 { font-size: 22px; font-weight: 700; color: var(--green-dark); margin-bottom: 0.25rem; }
.pamphlet-header p { font-size: 13px; color: var(--text-soft); }

.my-type-banner {
  background: var(--green-dark); color: var(--white);
  border-radius: 12px; padding: 12px 16px;
  font-size: 14px; text-align: center;
  margin-bottom: 1.5rem; line-height: 1.5;
}
.my-type-banner strong { font-size: 16px; }

.section-card {
  background: var(--white);
  border-radius: var(--radius);
  margin-bottom: 1rem;
  overflow: hidden;
  border: 2px solid transparent;
  transition: border-color 0.2s, box-shadow 0.2s;
  cursor: pointer;
}
.section-card.highlighted {
  border-color: var(--green-dark);
  box-shadow: 0 4px 20px rgba(58,90,42,0.15);
}
.section-card.highlighted .section-header {
  background: var(--green-dark);
  color: var(--white);
}
.section-card.highlighted .section-header .section-num {
  background: rgba(255,255,255,0.2);
  color: var(--white);
}

.section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px;
  background: #f7f6f2;
  transition: background 0.2s, color 0.2s;
}
.section-num {
  width: 32px; height: 32px;
  background: var(--green-light);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--green-dark);
  flex-shrink: 0;
}
.section-title { font-size: 17px; font-weight: 700; flex: 1; }
.section-arrow { font-size: 14px; opacity: 0.5; }
.section-preview { font-size: 13px; color: var(--text-soft); padding: 10px 16px 14px; line-height: 1.5; }

/* ───── MODAL ───── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-sheet {
  background: var(--white);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 420px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 1.5rem 1.25rem 2.5rem;
  animation: slideUp 0.25s ease;
}

@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-handle {
  width: 40px; height: 4px;
  background: #ddd; border-radius: 2px;
  margin: 0 auto 1.25rem;
}
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 1.25rem; color: var(--green-dark); }
.modal-close {
  position: absolute; top: 1rem; right: 1.25rem;
  background: none; border: none; font-size: 20px; cursor: pointer; color: #aaa;
}

.modal-section { margin-bottom: 1.5rem; }
.modal-section-title {
  font-size: 14px; font-weight: 700;
  color: var(--green-dark);
  margin-bottom: 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1.5px solid var(--green-light);
}
.modal-item {
  font-size: 14px; color: #333; line-height: 1.7;
  padding: 8px 12px; background: #f7f9f4;
  border-radius: 8px; margin-bottom: 8px;
}
.modal-item.bad { background: #fff4f4; border-left: 3px solid #e88; }
.modal-item.good { background: #f0f7ea; border-left: 3px solid var(--green-light); }
.modal-highlight {
  background: #eef4e8; border-radius: 10px;
  padding: 12px 14px; font-size: 14px; line-height: 1.65;
  color: var(--green-dark); font-weight: 500;
  margin-bottom: 10px;
}
.modal-tag {
  display: inline-block; font-size: 12px;
  background: var(--green-dark); color: var(--white);
  border-radius: 20px; padding: 3px 10px; margin-right: 4px; margin-bottom: 6px;
}

.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none;
  font-size: 14px; color: var(--text-soft);
  cursor: pointer; font-family: inherit;
  margin-bottom: 1rem;
}
</style>
</head>
<body>

<!-- ══════════ QUIZ PAGE ══════════ -->
<div class="page active" id="page-quiz">
  <div class="quiz-wrap">
    <div class="brand-tag">입고 또 입기 · 나의 의류 소비 유형 테스트</div>
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress" style="width:0%"></div>
      </div>
      <div class="progress-label" id="q-label">1 / 7</div>
    </div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>
    <button class="next-btn" id="next-btn">다음 →</button>
  </div>
</div>

<!-- ══════════ RESULT PAGE ══════════ -->
<div class="page" id="page-result">
  <div class="result-wrap">
    <div class="result-badge" id="result-badge"></div>
    <div class="result-type" id="result-type"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-desc" id="result-desc"></div>
    <div class="tip-title">이런 점을 참고해보세요</div>
    <div id="result-tips"></div>
    <button class="guide-btn" id="guide-btn">📄 내 맞춤 가이드 보러가기 →</button>
    <button class="retry-btn" onclick="restart()">↩ 다시 해보기</button>
  </div>
</div>

<!-- ══════════ PAMPHLET PAGE ══════════ -->
<div class="page" id="page-pamphlet">
  <div class="pamphlet-wrap">
    <button class="back-btn" onclick="goBack()">← 결과로 돌아가기</button>
    <div class="pamphlet-header">
      <h1>입고 또 입기 가이드북</h1>
      <p>항목을 클릭하면 상세 내용을 볼 수 있어요</p>
    </div>

    <div class="my-type-banner" id="my-type-banner"></div>

    <!-- 구매 전 -->
    <div class="section-card" id="card-buy" onclick="openModal('buy')">
      <div class="section-header">
        <div class="section-num">1</div>
        <div class="section-title">구매 전</div>
        <div class="section-arrow">▼</div>
      </div>
      <div class="section-preview">치수 파악 → 리뷰 확인 → 코디 가능 여부</div>
    </div>

    <!-- 활용 -->
    <div class="section-card" id="card-use" onclick="openModal('use')">
      <div class="section-header">
        <div class="section-num">2</div>
        <div class="section-title">활용</div>
        <div class="section-arrow">▼</div>
      </div>
      <div class="section-preview">레이어드, 재해석, 리폼으로 새 조합</div>
    </div>

    <!-- 관리 -->
    <div class="section-card" id="card-care" onclick="openModal('care')">
      <div class="section-header">
        <div class="section-num">3</div>
        <div class="section-title">관리</div>
        <div class="section-arrow">▼</div>
      </div>
      <div class="section-preview">소재에 맞는 세탁법과 보관법 준수</div>
    </div>

    <!-- 처분 -->
    <div class="section-card" id="card-dispose" onclick="openModal('dispose')">
      <div class="section-header">
        <div class="section-num">4</div>
        <div class="section-title">처분</div>
        <div class="section-arrow">▼</div>
      </div>
      <div class="section-preview">재사용 우선 → 의류수거함 올바르게 이용</div>
    </div>

  </div>
</div>

<!-- ══════════ MODALS ══════════ -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

// ── 상태 ──
let current = 0;
let answers = [];
let selectedIdx = null;
let currentType = null;

function getTopType(scores) {
  return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
}

// ── 퀴즈 렌더 ──
function render() {
  const q = questions[current];
  document.getElementById('q-label').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress').style.width = `${(current / questions.length) * 100}%`;

  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  selectedIdx = null;
  document.getElementById('next-btn').classList.remove('active');

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = () => {
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedIdx = i;
      document.getElementById('next-btn').classList.add('active');
    };
    optDiv.appendChild(btn);
  });
}

function next() {
  if (selectedIdx === null) return;
  answers.push(questions[current].options[selectedIdx].scores);
  current++;
  if (current >= questions.length) showResult();
  else render();
}

// ── 결과 ──
function showResult() {
  const totals = { 탐색: 0, 충동: 0, 균형: 0, 활용: 0 };
  answers.forEach(sc => Object.entries(sc).forEach(([k, v]) => { totals[k] += v; }));
  currentType = getTopType(totals);
  const r = results[currentType];

  document.getElementById('page-quiz').classList.remove('active');
  document.getElementById('page-result').classList.add('active');

  document.getElementById('result-badge').textContent = r.badge;
  document.getElementById('result-type').textContent = r.type;
  document.getElementById('result-sub').textContent = r.sub;
  document.getElementById('result-desc').textContent = r.desc;

  const tipsDiv = document.getElementById('result-tips');
  tipsDiv.innerHTML = '';
  r.tips.forEach(tip => {
    const d = document.createElement('div');
    d.className = 'tip-item';
    d.textContent = tip;
    tipsDiv.appendChild(d);
  });

  document.getElementById('guide-btn').onclick = goToPamphlet;
}

// ── 팜플렛으로 이동 ──
function goToPamphlet() {
  const r = results[currentType];
  document.getElementById('page-result').classList.remove('active');
  document.getElementById('page-pamphlet').classList.add('active');

  document.getElementById('my-type-banner').textContent = r.banner;

  // 모든 카드 강조 해제
  ['buy','use','care','dispose'].forEach(id => {
    document.getElementById('card-' + id).classList.remove('highlighted');
  });

  // 해당 유형 섹션 강조 후 스크롤
  if (r.highlight) {
    const card = document.getElementById('card-' + r.highlight);
    card.classList.add('highlighted');
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
  }
}

function goBack() {
  document.getElementById('page-pamphlet').classList.remove('active');
  document.getElementById('page-result').classList.add('active');
}

// ── 모달 ──
function openModal(key) {
  const c = modalContents[key];
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">${c.title}</div>
    ${c.html}
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

// ── 다시하기 ──
function restart() {
  current = 0; answers = []; selectedIdx = null; currentType = null;
  document.getElementById('page-result').classList.remove('active');
  document.getElementById('page-quiz').classList.add('active');
  render();
}

document.getElementById('next-btn').onclick = next;
render();
</script>
